# ─────────────────────────────────────────────────────────────────────────────
# Standalone manifest: Kumi builds from this directory alone.
# NO workspace inheritance here: `kumizo-kit` comes from crates.io, so the
# source can be copied and edited anywhere without the rest of the repository.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name = "kumi"
version = "0.12.1"
edition = "2021"
authors = ["noobmaisfier"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noobmaisfier/A28"
readme = "README.md"
description = "Kumi shell: floating bar, control center, launcher, tasks, power, notifs, toasts, OSD, pomodoro"
keywords = ["wayland", "shell", "status-bar", "gpui"]
categories = ["gui"]

[[bin]]
name = "kumi"
path = "src/main.rs"

[[bin]]
name = "kumi-lockscreen"
path = "src/lockscreen.rs"

[dependencies]
kumizo-kit = { version = "0.12.1", default-features = false, features = ["app", "layer-shell"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = true }
async-io = "2.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
smallvec = "1"
# No audio engine here: the shell only reads MPRIS media (browser,
# external player…). A local player lives in its own process and publishes
# itself via MPRIS — keeping the shell MIT OR Apache-2.0.
