# Flexoki Light for foot - https://stephango.com/flexoki
# ANSI mapping mirrors upstream alacritty/flexoki-light.toml
# (normal == bright == dim upstream; 400-series on paper)
# RRGGBB lowercase, no prefix (man foot.ini: colors-dark, colors-light)

[colors-light]
foreground=100f0f
background=fffcf0

# Normal (0-7) - 600-series: the flexoki site recommends 600 for
# text on a light background (contrast 4.4-6.4:1 vs 3.0-4.2:1 at 400).
regular0=100f0f  # black
regular1=af3029  # red
regular2=66800b  # green
regular3=ad8301  # yellow
regular4=205ea6  # blue
regular5=a02f6f  # magenta
regular6=24837b  # cyan
regular7=fffcf0  # white

# Bright (8-15) - 400-series (bold/underline rendering: vivid, e.g. red errors)
bright0=100f0f
bright1=d14d41
bright2=879a39
bright3=d0a215
bright4=4385be
bright5=ce5d97
bright6=3aa99f
bright7=fffcf0

# Dim - follows the normal colors (600)
dim0=100f0f
dim1=af3029
dim2=66800b
dim3=ad8301
dim4=205ea6
dim5=a02f6f
dim6=24837b
dim7=fffcf0

# cursor = <text> <cursor> (upstream: cursor #100F0F, text #FFFCF0)
cursor=fffcf0 100f0f

# Visual selection = ui-2 #DAD8CE (same as nvim Visual)
selection-foreground=100f0f
selection-background=dad8ce

search-box-no-match=fffcf0 af3029
# match on yellow-100 #FCEEB8 (readable paper-tinted yellow)
search-box-match=100f0f fceeb8

jump-labels=fffcf0 bc5215
scrollback-indicator=100f0f 4385be
urls=205ea6
