# Nord for yazi - NO EXISTING PORT, built from the tokyonight_night.toml template
# (https://github.com/folke/tokyonight.nvim) with the official Nord palette.
[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#e5e9f0", italic = true }

# Hovered
hovered         = { bg = "#434c5e" }
preview_hovered = { bg = "#434c5e" }

# Find
find_keyword  = { fg = "#3b4252", bg = "#d08770", bold = true }
find_position = { fg = "#88c0d0", bg = "#3b4252", bold = true }

# Marker
marker_copied   = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut      = { fg = "#bf616a", bg = "#bf616a" }
marker_marked   = { fg = "#b48ead", bg = "#b48ead" }
marker_selected = { fg = "#81a1c1", bg = "#81a1c1" }

# Count
count_copied   = { fg = "#3b4252", bg = "#a3be8c" }
count_cut      = { fg = "#3b4252", bg = "#bf616a" }
count_selected = { fg = "#3b4252", bg = "#81a1c1" }

# Border
border_symbol = "│"
border_style  = { fg = "#81a1c1" }

# Tab
[tabs]
active   = { fg = "#2e3440", bg = "#81a1c1" }
inactive = { fg = "#81a1c1", bg = "#4c566a" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#2e3440", bg = "#81a1c1", bold = true }
normal_alt  = { fg = "#81a1c1", bg = "#4c566a" }

select_main = { fg = "#2e3440", bg = "#b48ead", bold = true }
select_alt  = { fg = "#b48ead", bg = "#4c566a" }

unset_main  = { fg = "#2e3440", bg = "#b48ead", bold = true }
unset_alt   = { fg = "#b48ead", bg = "#4c566a" }

[indicator]
parent  = { fg = "#d8dee9", bg = "#4c566a" }
current = { fg = "#81a1c1", bg = "#4c566a", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

overall   = { fg = "#d8dee9", bg = "#3b4252" }

# Progress
progress_label  = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#5e81ac", bg = "#434c5e" }
progress_error  = { fg = "#bf616a", bg = "#434c5e" }

# Permissions
perm_type  = { fg = "#81a1c1" }
perm_read  = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec  = { fg = "#a3be8c" }
perm_sep   = { fg = "#4c566a" }

[pick]
border   = { fg = "#81a1c1" }
active   = { fg = "#d8dee9",  bg = "#434c5e" }
inactive = { fg = "#d8dee9" }

# Input
[input]
border   = { fg = "#88c0d0" }
title    = { fg = "#88c0d0" }
value    = { fg = "#b48ead" }
selected = { bg = "#434c5e" }

# Completion
[cmp]
border   = { fg = "#88c0d0" }
active   = { fg = "#d8dee9", bg = "#4c566a" }
inactive = { fg = "#d8dee9" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#81a1c1" }
title   = { fg = "#81a1c1" }
hovered = { fg = "#d8dee9", bg = "#434c5e" }

# Which
[which]
cols            = 3
mask            = { bg = "#3b4252" }
cand            = { fg = "#88c0d0" }
rest            = { fg = "#d8dee9" }
desc            = { fg = "#b48ead" }
separator       = " ➜ "
separator_style = { fg = "#4c566a" }

# Confirm
[confirm]
border  = { fg = "#88c0d0" }
title   = { fg = "#81a1c1" }
body = {}
list    = {}
btn_yes = { bg = "#434c5e" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#81a1c1" }
title   = { fg = "#81a1c1" }

# Notify
[notify]
title_info  = { fg = "#88c0d0" }
title_warn  = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "#a3be8c" }
run     = { fg = "#b48ead" }
desc    = { fg = "#88c0d0" }
hovered = { bg = "#434c5e" }
footer  = { fg = "#d8dee9", bg = "#2e3440" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#ebcb8b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#b48ead" },

	# Archives
	{ mime = "application/*zip", fg = "#bf616a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#bf616a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#88c0d0" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#bf616a" },

	# Special files
	{ url = "*", is = "orphan", bg = "#bf616a" },
	{ url = "*", is = "exec"  , fg = "#a3be8c" },

	# Fallback
	{ url = "*/", fg = "#81a1c1" },
	{ url = "*", fg = "#d8dee9" }
]
    