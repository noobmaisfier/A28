# Gruvbox Dark for yazi - derived from the nord.toml template
# (official morhetz/gruvbox palette, dark variant).
[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#fbf1c7", italic = true }

# Hovered
hovered         = { bg = "#3c3836" }
preview_hovered = { bg = "#3c3836" }

# Find
find_keyword  = { fg = "#32302f", bg = "#fe8019", bold = true }
find_position = { fg = "#83a598", bg = "#32302f", bold = true }

# Marker
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }
marker_marked   = { fg = "#d3869b", bg = "#d3869b" }
marker_selected = { fg = "#83a598", bg = "#83a598" }

# Count
count_copied   = { fg = "#32302f", bg = "#b8bb26" }
count_cut      = { fg = "#32302f", bg = "#fb4934" }
count_selected = { fg = "#32302f", bg = "#83a598" }

# Border
border_symbol = "│"
border_style  = { fg = "#83a598" }

# Tab
[tabs]
active   = { fg = "#282828", bg = "#83a598" }
inactive = { fg = "#83a598", bg = "#504945" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#282828", bg = "#83a598", bold = true }
normal_alt  = { fg = "#83a598", bg = "#504945" }

select_main = { fg = "#282828", bg = "#d3869b", bold = true }
select_alt  = { fg = "#d3869b", bg = "#504945" }

unset_main  = { fg = "#282828", bg = "#d3869b", bold = true }
unset_alt   = { fg = "#d3869b", bg = "#504945" }

[indicator]
parent  = { fg = "#ebdbb2", bg = "#504945" }
current = { fg = "#83a598", bg = "#504945", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

overall   = { fg = "#ebdbb2", bg = "#32302f" }

# Progress
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#458588", bg = "#3c3836" }
progress_error  = { fg = "#fb4934", bg = "#3c3836" }

# Permissions
perm_type  = { fg = "#83a598" }
perm_read  = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#b8bb26" }
perm_sep   = { fg = "#504945" }

[pick]
border   = { fg = "#83a598" }
active   = { fg = "#ebdbb2",  bg = "#3c3836" }
inactive = { fg = "#ebdbb2" }

# Input
[input]
border   = { fg = "#83a598" }
title    = { fg = "#83a598" }
value    = { fg = "#d3869b" }
selected = { bg = "#3c3836" }

# Completion
[cmp]
border   = { fg = "#83a598" }
active   = { fg = "#ebdbb2", bg = "#504945" }
inactive = { fg = "#ebdbb2" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#83a598" }
title   = { fg = "#83a598" }
hovered = { fg = "#ebdbb2", bg = "#3c3836" }

# Which
[which]
cols            = 3
mask            = { bg = "#32302f" }
cand            = { fg = "#83a598" }
rest            = { fg = "#ebdbb2" }
desc            = { fg = "#d3869b" }
separator       = " ➜ "
separator_style = { fg = "#504945" }

# Confirm
[confirm]
border  = { fg = "#83a598" }
title   = { fg = "#83a598" }
body = {}
list    = {}
btn_yes = { bg = "#3c3836" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#83a598" }
title   = { fg = "#83a598" }

# Notify
[notify]
title_info  = { fg = "#83a598" }
title_warn  = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "#b8bb26" }
run     = { fg = "#d3869b" }
desc    = { fg = "#83a598" }
hovered = { bg = "#3c3836" }
footer  = { fg = "#ebdbb2", bg = "#282828" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#fabd2f" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d3869b" },

	# Archives
	{ mime = "application/*zip", fg = "#fb4934" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#fb4934" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#83a598" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#fb4934" },

	# Special files
	{ url = "*", is = "orphan", bg = "#fb4934" },
	{ url = "*", is = "exec"  , fg = "#b8bb26" },

	# Fallback
	{ url = "*/", fg = "#83a598" },
	{ url = "*", fg = "#ebdbb2" }
]
    