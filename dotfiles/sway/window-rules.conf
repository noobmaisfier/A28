###############################################################################
# FLOATING WINDOWS AND RULES MANAGEMENT (Sway)
###############################################################################

# --- 1. Standard XWayland / Legacy windows ---
# Dialogs, utilities, toolbars, splash screens, menus
for_window [window_type="dialog"]       floating enable
for_window [window_type="utility"]      floating enable
for_window [window_type="toolbar"]      floating enable
for_window [window_type="splash"]       floating enable
for_window [window_type="menu"]         floating enable   # XWayland only
for_window [window_type="dropdown_menu"] floating enable # XWayland only
for_window [window_type="popup_menu"]   floating enable
for_window [window_role="pop-up"]       floating enable
for_window [window_role="task_dialog"]  floating enable
for_window [window_role="About"]        floating enable

# --- 2. Wayland system applications (app_id) ---
for_window [app_id="pavucontrol"]          floating enable, resize set 800 600
for_window [app_id="blueman-manager"]      floating enable, resize set 700 500
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="iwgtk"]                   floating enable
for_window [app_id="org.gnome.Calculator"] floating enable, sticky enable
for_window [app_id="it.miyakogi.copyq"]    floating enable, sticky enable
for_window [app_id="org.gnome.Nautilus" title="(?i)Properties"] floating enable

# --- 3. File dialogs and browsers ---
for_window [title="(?i)open file"]        floating enable
for_window [title="(?i)save file"]        floating enable
for_window [title="(?i)file upload"]      floating enable
for_window [title="(?i)select a folder"]  floating enable
for_window [title="(?i)confirm replace"]  floating enable

# Firefox / Librewolf specific
for_window [app_id="firefox" title="^Library$"]   floating enable, sticky enable
for_window [app_id="firefox" title="^Attention$"] floating enable

# --- 4. Multimedia and utilities ---
for_window [app_id="imv"]        floating enable
for_window [app_id="mpv"]        floating enable, resize set 960 540
for_window [app_id="qt5ct"]      floating enable
for_window [app_id="qt6ct"]      floating enable
for_window [app_id="lxappearance"] floating enable
for_window [app_id="galculator"] floating enable

# --- 5. IDEs and editors ---
for_window [class="jetbrains-.*" title="^win\d+$"] floating enable, border none
for_window [class="jetbrains-.*" title="^Confirm Exit"] floating enable

# --- 6. GIMP ---
for_window [class="Gimp" window_role="gimp-toolbox"] floating enable
for_window [class="Gimp" window_role="gimp-dock"]    floating enable

# --- 7. Small windows and misc dialogs ---
for_window [window_role="Preferences"] floating enable
for_window [window_role="About"]       floating enable

# --- 8. General behavior ---
# Automatically center all floating windows
for_window [floating] move position center

# Thin border for all floating windows
for_window [floating] border pixel 2

# Focus on urgent windows
focus_on_window_activation focus

# Do not automatically give focus to notifications
no_focus [window_type="notification"]




### Application rules

# Terminal applications on workspace 1
assign [app_id="Alacritty"] workspace 1
assign [app_id="kitty"] workspace 1
assign [app_id="com.mitchellh.ghostty"] workspace 1

# Browsers on workspace 2
assign [app_id="Brave-browser"] workspace 2
assign [app_id="zen-browser"] workspace 2
assign [app_id="chromium"] workspace 2
assign [app_id="thorium-browser"] workspace 2
assign [app_id="LibreWolf"] workspace 2

# File manager on workspace 3
assign [app_id="Thunar"] workspace 3

# Code editors on workspace 4
assign [app_id="Geany"] workspace 4
assign [app_id="dev.zed.Zed"] workspace 4
assign [app_id="code"] workspace 4
assign [app_id="gvim"] workspace 4
# assign [app_id="foot"] workspace 4

# PDF viewers on workspace 5
assign [app_id="Evince"] workspace 5
assign [app_id="atril"] workspace 5

# Messaging and note-taking apps on workspace 6
assign [app_id="org.telegram.desktop"] workspace 6
assign [app_id="obsidian"] workspace 6
assign [app_id="AppFlowy"] workspace 6

# Media players on workspace 7
assign [app_id="com.github.rafostar.Clapper"] workspace 7
assign [app_id="vlc"] workspace 7
assign [app_id="com.sayonara-player.Sayonara"] workspace 7
assign [app_id="mpv"] workspace 7

# System tools on workspace 8
assign [app_id="VirtualBox Manager"] workspace 8
assign [app_id="gparted"] workspace 8
