###############################################################################
# COMPLETE KEY BINDINGS FOR SWAY
###############################################################################

# --- Terminal & basic commands ---
bindsym $mod+Return exec $term
bindsym $mod+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# --- Workspace back and forth ---
bindsym $mod+Tab workspace back_and_forth

# --- Focus movement ---
# Home row
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
# Arrow keys
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# --- Move focused window ---
# Mod+Ctrl+hjkl (vim); Mod+Shift+l is reserved for locking, so the vim set
# of movement keys moves to Mod+Ctrl and the arrows stay on Mod+Shift.
bindsym $mod+Ctrl+$left move left
bindsym $mod+Ctrl+$down move down
bindsym $mod+Ctrl+$up move up
bindsym $mod+Ctrl+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# --- Workspaces switch & move ---
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# --- Layout & floating ---
bindsym $mod+s layout stacking
bindsym $mod+t layout tabbed
#bindsym $mod+e layout toggle split
# Optional split horizontal/vertical
#bindsym $mod+b splith
#bindsym $mod+v splitv

bindsym $mod+f fullscreen
bindsym $mod+space floating toggle
bindsym $mod+Shift+space focus mode_toggle
floating_modifier $mod normal

# Move focus to parent container (optional)
#bindsym $mod+a focus parent

# --- Resize mode ---
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# --- Scratchpad ---
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# --- Utilities ---
# Audio keys
bindsym --locked XF86AudioMute exec ~/.local/bin/volume mute
bindsym --locked XF86AudioLowerVolume exec ~/.local/bin/volume down
bindsym --locked XF86AudioRaiseVolume exec ~/.local/bin/volume up
bindsym --locked XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness keys
bindsym --locked XF86MonBrightnessDown exec ~/.local/bin/brightness down
bindsym --locked XF86MonBrightnessUp exec ~/.local/bin/brightness up

# Screenshots
bindsym Print exec grim - | tee ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy && notify-send "Screenshot saved and copied"
bindsym $mod+Shift+s exec grim -g "$(slurp)" - | tee ~/Pictures/selection-$(date +%Y%m%d-%H%M%S).png | wl-copy && notify-send "Selection saved and copied"

# Lock screen (Kumi locker, standalone — no socket conflict with the shell)
bindsym $mod+Shift+l exec ~/.local/bin/kumi-lockscreen

# --- Applications ---
bindsym $mod+Shift+f exec Thunar
bindsym $mod+Shift+w exec helium-browser
# Mod+c is taken by the Control Center; galculator via the launcher (Mod+a).

# Theme: Mod+Shift+t opens the picker (list + Enter applies).
bindsym $mod+Shift+t exec ~/.local/bin/kumizo toggle kumi-themes

# Next/previous wallpaper (awww-cycle, theme transition)
bindsym $mod+p exec $HOME/.local/bin/awww-cycle next
bindsym $mod+Shift+p exec $HOME/.local/bin/awww-cycle prev

# --- Kumi shell (shell ACTIF) ---
# Mod+a: launcher   Mod+w: tasks   Mod+c: control center   Mod+d: notifs
# Mod+x: power      Mod+n: network (iwgtk)   Mod+v: clipboard   Mod+b: bar
# Mod+m: free (the music player is no longer in the shell; media
#          is controlled via MPRIS, see `playerctl play-pause`)
bindsym $mod+a exec ~/.local/bin/kumizo toggle kumi-launcher
bindsym $mod+w exec ~/.local/bin/kumizo toggle kumi-tasks
bindsym $mod+c exec ~/.local/bin/kumizo toggle kumi-control
bindsym $mod+d exec ~/.local/bin/kumizo toggle kumi-notifs
bindsym $mod+x exec ~/.local/bin/kumizo toggle kumi-power
bindsym $mod+v exec ~/.local/bin/kumizo toggle kumi-clipboard
bindsym $mod+b exec ~/.local/bin/kumizo toggle kumi-bar
bindsym $mod+n exec iwgtk
# Mod+Shift+e remains the session exit (swaynag).
# Lock = Mod+Shift+l (section "Utilities"). `Mod+l` remains `focus right`.
